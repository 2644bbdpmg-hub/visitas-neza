async function fbReq(p,opt={}){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),NET_TIMEOUT);
  try{
    const r=await fetch(FB+"/"+p+".json",{...opt,signal:ctl.signal,headers:{"Content-Type":"application/json",...(opt.headers||{})}});
    const txt=await r.text();
    let data=null;try{data=txt?JSON.parse(txt):null}catch(e){data=txt}
    if(!r.ok)throw new Error((data&&data.error)||`Firebase ${r.status}`);
    return data;
  }catch(e){
    if(e.name==="AbortError")throw new Error("La conexión tardó demasiado. Revisa tu señal e intenta nuevamente.");
    throw e;
  }finally{clearTimeout(tm)}
}

function fd(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${dd}`}
function pd(s){const[y,m,dd]=s.split("-").map(Number);return new Date(y,m-1,dd)}

function gDias(){return Object.entries(DIAS).map(([k,v])=>({...v,_k:k}))}
function gFDias(){
  const all=gDias();
  // Filtro por día específico
  if(SEL_DAY) return all.filter(d=>d.fecha===SEL_DAY);
  // Filtro por semana operativa seleccionada
  if(SEL_WEEK){
    return all.filter(d=>d.fecha>=SEL_WEEK.start&&d.fecha<=SEL_WEEK.end);
  }
  if(PER==="all")return all;
  const h=new Date();
  if(PER==="month"){const y=h.getFullYear(),m=h.getMonth();return all.filter(d=>{const dt=pd(d.fecha);return dt.getFullYear()===y&&dt.getMonth()===m})}
  if(PER==="week"){const dy=h.getDay(),mo=new Date(h);mo.setDate(h.getDate()-(dy===0?6:dy-1));mo.setHours(0,0,0,0);const su=new Date(mo);su.setDate(mo.getDate()+6);su.setHours(23,59,59,999);return all.filter(d=>{const dt=pd(d.fecha);return dt>=mo&&dt<=su})}
  return all;
}

function pMin(h){if(!h)return null;const[t,m]=h.replace(" a.m.","").replace(" p.m.","").split(":").map(Number);return(h.includes("p.m.")&&t!==12?t+12:t)*60+m}
// ── Semanas ISO ──
function getISOWeek(d){
  const dt=new Date(d.getTime());dt.setHours(0,0,0,0);
  dt.setDate(dt.getDate()+4-(dt.getDay()||7));
  const y=new Date(dt.getFullYear(),0,1);
  return{week:Math.ceil(((dt-y)/86400000+1)/7),year:dt.getFullYear()};
}
function getWeekRange(year,week){
  const jan4=new Date(year,0,4);
  const startOfW1=new Date(jan4);startOfW1.setDate(jan4.getDate()-(jan4.getDay()||7)+1);
  const start=new Date(startOfW1);start.setDate(startOfW1.getDate()+(week-1)*7);
  const end=new Date(start);end.setDate(start.getDate()+6);
  return{start:fd(start),end:fd(end)};
}
function weeksInYear(year){
  const dec28=new Date(year,11,28);return getISOWeek(dec28).week;
}
function dur(h1,h2){
  if(!h1||!h2)return null;
  const d=pMin(h2)-pMin(h1);if(d<=0)return null;
  const hr=Math.floor(d/60),mn=d%60;return hr>0?`${hr}h${mn>0?" "+mn+"min":""}`:`${mn}min`
}
function vcnt(gid,rid){return gFDias().filter(d=>d.rid===rid&&(d.ap?.gid===gid||d.ci?.gid===gid)).length}
function eqScore(rid){
  const gs=grByR(rid),c=gs.map(g=>vcnt(g.id,rid)),tot=c.reduce((a,b)=>a+b,0);
  if(!tot)return null;
  const avg=tot/c.length,std=Math.sqrt(c.reduce((a,b)=>a+Math.pow(b-avg,2),0)/c.length);
  return Math.max(0,Math.round(100-(std/avg*100)));
}

function setSemana(week,year){
  const w=parseInt(week),y=parseInt(year);
  const range=getWeekRange(y,w);
  SEL_WEEK={week:w,year:y,...range};
  SEL_DAY=null;PER="all";SHOW_TARD=false;R();
}
function setDia(fecha){
  if(!fecha){SEL_DAY=null;R();return}
  SEL_DAY=fecha;SEL_WEEK=null;PER="all";SHOW_TARD=false;R();
}
function perLbl(){
  if(SEL_DAY) return shD(SEL_DAY);
  if(SEL_WEEK) return `Semana ${SEL_WEEK.week} (${shD(SEL_WEEK.start)} - ${shD(SEL_WEEK.end)})`;
  return PER==="week"?"Esta semana":PER==="month"?"Este mes":"Histórico";
}

function cap1(t){return t?t.charAt(0).toUpperCase()+t.slice(1):t}
function nextLaboral(ds){const d=pd(ds);d.setDate(d.getDate()+1);if(d.getDay()===0)d.setDate(d.getDate()+1);return fd(d)}
// Registro (del día anterior) que declaró el plan para una fecha dada
function planPara(rid,fecha){return gDias().find(d=>d.rid===rid&&d.plan&&d.plan.fecha===fecha)||null}
function getPlan(rid,fecha){const r=planPara(rid,fecha);return r?r.plan:null}
// Alterna el plan entre "sí me presento" y "no me presento"
function togPlan(no){

// Compara la gerencia declarada contra la que se está registrando y muestra/oculta la alerta
function chkDesvio(){
  const box=document.getElementById("desv-box");if(!box)return;
  const isA=SES.role==="admin",rid=isA?parseInt(document.getElementById("sR")?.value):SES.rid;
  const gid=parseInt(document.getElementById("sG")?.value);
  const p=(isNaN(rid)||rid===null)?null:getPlan(rid,getHoy());
  if(!p||isNaN(gid)||!gid){box.style.display="none";return}
  const t=document.getElementById("desv-txt"),tt=document.getElementById("desv-tit");
  if(p.noAsiste){
    if(tt)tt.textContent="⚠️ HABÍAS DECLARADO QUE NO TE PRESENTABAS";
    if(t)t.innerHTML=`Declaraste <b>${p.motivo||"ausencia"}</b> para hoy y te estás registrando en <b>${getGer(gid).n||"—"}</b>. Explica el motivo del cambio para poder guardar.`;
    box.style.display="block";return;
  }
  if(!p.gid||p.gid===gid){box.style.display="none";return}
  const gp=getGer(p.gid),gr=getGer(gid);
  if(tt)tt.textContent="⚠️ NO ES LA GERENCIA QUE DECLARASTE";
  if(t)t.innerHTML=`Declaraste presentarte en <b>${gp.n||"—"}</b>${gp.cod?" · "+gp.cod:""} y te estás registrando en <b>${gr.n||"—"}</b>${gr.cod?" · "+gr.cod:""}. Explica el motivo para poder guardar.`;
  box.style.display="block";
}
async function syncNow(force=false){
  if(SAVING&&!force)return;
  const form=VIEW==="REG"?capForm():null;
  SYNC=true;updSync();
  try{
    const d=await fbG("dias");DIAS=d||{};LAST=new Date();SYNC=false;
    if(SES){R();if(VIEW==="REG"&&!force)restoreForm(form)}
  }
  catch(e){SYNC=false;if(SES){updSync();if(force)showT("⚠ No fue posible sincronizar: "+e.message,"#dc2626")}}
}

function getPositionSafe(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){resolve(null);return}
    let done=false;const finish=v=>{if(done)return;done=true;resolve(v)};
    const hard=setTimeout(()=>finish(null),5500);
    try{navigator.geolocation.getCurrentPosition(
      p=>{clearTimeout(hard);finish(p)},
      ()=>{clearTimeout(hard);finish(null)},
      {timeout:4000,maximumAge:0,enableHighAccuracy:true}
    )}catch(e){clearTimeout(hard);finish(null)}
  })
}
async function guardar(){
  if(SAVING)return;
  const isA=SES.role==="admin",rid=isA?parseInt(document.getElementById("sR")?.value):SES.rid;
  const gid=parseInt(document.getElementById("sG")?.value),nota=document.getElementById("sN")?.value.trim()||"";
  const fecha=getHoy();
  if((isNaN(rid)||(!rid&&rid!==0))||!gid){showT("Selecciona una gerencia antes de registrar","#dc2626");return}
  const btn=document.querySelector("button[onclick='guardar()']");
  SAVING=true;if(btn){btn.disabled=true;btn.textContent="Guardando..."}
  try{
    // Consultar Firebase antes de guardar para evitar duplicados por datos locales desactualizados.
    const rem=await fbG("dias")||{};DIAS=rem;
    const ex=Object.entries(rem).map(([k,v])=>({...v,_k:k})).find(d=>d.rid===rid&&d.fecha===fecha);
    if(ex?.[TIPO]&&!confirm(`Ya existe un ${TIPO==="ap"?"registro de apertura":"registro de cierre"} para hoy. ¿Deseas reemplazarlo?`))return;
    const h=hora(),pos=await getPositionSafe();
    const gps=pos?{lat:+pos.coords.latitude.toFixed(6),lng:+pos.coords.longitude.toFixed(6),acc:Math.round(pos.coords.accuracy||0)}:null;
    const dato={gid,hora:h,...(gps||{})};
    if(TIPO==="ap"){
      // Desviación respecto al plan declarado el día anterior
      const pl=getPlan(rid,fecha);
      if(pl&&(pl.noAsiste||(pl.gid&&pl.gid!==gid))){
        const just=document.getElementById("sJust")?.value.trim()||"";
        if(!just){showT("Escribe la justificación: no coincide con lo que declaraste","#dc2626");chkDesvio();const jb=document.getElementById("sJust");if(jb)jb.focus();return}
        dato.desv={planGid:pl.gid||null,planNo:!!pl.noAsiste,planMotivo:pl.motivo||"",just};
      }
      if(ex)await fbU(`dias/${ex._k}`,{ap:dato,nota:nota||ex.nota||""});
      else await fbP("dias",{rid,fecha,nota,ap:dato,ci:null});
      showT(dato.desv?"🌅 Apertura registrada con desviación · "+h:"🌅 Apertura registrada · "+h,dato.desv?"#dc2626":"#e85d04");
    }else{
      // 1) Cumplimiento de las actividades comprometidas para hoy
      const pl=getPlan(rid,fecha);
      if(pl&&pl.acts&&pl.acts.length){
        dato.cump={acts:pl.acts.map((a,i)=>({t:a,ok:!!document.getElementById("ck"+i)?.checked})),
                   otras:document.getElementById("sOtras")?.value.trim()||""};
      }else{
        const ot=document.getElementById("sOtras")?.value.trim()||"";
        if(ot)dato.cump={acts:[],otras:ot};
      }
      // 2) Plan del siguiente día — obligatorio salvo el sábado
      const esSab=pd(fecha).getDay()===6;
      const pNo=document.getElementById("pNo")?.value==="1";
      const pF=document.getElementById("pF")?.value||"";
      const pG=parseInt(document.getElementById("pG")?.value);
      const pA=(document.getElementById("pA")?.value||"").split("\n").map(s=>s.trim()).filter(Boolean);
      const pMot=document.getElementById("pMot")?.value||"";
      const pJ=(document.getElementById("pJust")?.value||"").trim();
      let plan=null;
      if(pNo){
        if(!pMot){showT("Selecciona el motivo por el que no te presentas","#dc2626");return}
        if(pMot==="Otro"&&!pJ){showT("Describe el motivo en la justificación","#dc2626");return}
        plan={fecha:pF||nextLaboral(fecha),noAsiste:true,motivo:pMot,just:pJ,ts:h};
      }else if(pG&&pA.length){
        plan={fecha:pF||nextLaboral(fecha),gid:pG,acts:pA,ts:h};
      }else if(!esSab){
        if(!pG){showT("Selecciona la gerencia donde te presentas mañana","#dc2626");return}
        showT("Escribe al menos una actividad para mañana","#dc2626");return;
      }
      const upd={ci:dato,nota:nota||ex?.nota||""};
      if(plan)upd.plan=plan;
      if(ex)await fbU(`dias/${ex._k}`,upd);
      else await fbP("dias",{rid,fecha,nota,ap:null,...upd});
      showT("🌆 Cierre registrado · "+h,"#2563eb");
    }
    await syncNow(true);
  }catch(e){
    showT("⚠ No se guardó: "+(e.message||"error de conexión"),"#dc2626");
  }finally{
    SAVING=false;
    const b=document.querySelector("button[onclick='guardar()']");if(b){b.disabled=false;b.textContent=TIPO==="ap"?"🌅 Registrar Apertura":"🌆 Registrar Cierre"}
  }
}

      ${regsShow.map(r=>{const bc=CLR[r.id]||"#e85d04",n=todosD.filter(d=>d.rid===r.id).length,act=isA?(CAL_F===r.id):(r.id===rid);
        return`<button onclick="${isA?`CAL_F=${r.id};CDS=null;R()`:""}" style="display:flex;align-items:center;gap:4px;border-radius:20px;padding:3px 10px;border:2px solid ${act?bc:bc+"40"};background:${act?bc:"transparent"};cursor:${isA?"pointer":"default"}">
          <div style="width:6px;height:6px;border-radius:50%;background:${act?"#fff":bc}"></div>
          <span style="font-size:10px;font-weight:700;color:${act?"#fff":bc}">${r.n}</span>
          <span style="font-size:9px;color:${act?"#ffffff88":"var(--s)"}"> ${n}</span>
        </button>`;}).join("")}
    </div>
    ${isA&&CAL_F!==null?`<div style="font-size:11px;color:var(--s);margin-top:7px;padding:5px 9px;background:#f8fafc;border-radius:8px">
      Mostrando: <b style="color:${CLR[CAL_F]||"#e85d04"}">${(REGS.find(r=>r.id===CAL_F)||{}).n||""}</b>
      — <button onclick="CAL_F=null;CDS=null;R()" style="background:transparent;border:none;color:var(--o);font-size:11px;font-weight:700;cursor:pointer;text-decoration:underline">Ver todos</button>
    </div>`:""}
  </div>`;
  const dows=["L","M","X","J","V","S","D"];
  let grid=`<div class="cal-grid" style="margin-bottom:4px">${dows.map(d=>`<div class="cal-head">${d}</div>`).join("")}</div><div class="cal-grid">`;
  for(let i=0;i<sdow;i++)grid+=`<div class="cal-cell empty"></div>`;
  for(let day=1;day<=total;day++){
    const ds=CY+"-"+String(CM+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
    const its=byD[ds]||[];const isTod=ds===todayS,isSel=ds===CDS,isWk=((sdow+day-1)%7)>=5;
    grid+=`<div onclick="CDS='${ds}';R()" class="cal-cell${isTod||isSel?" today":""}${isSel?" sel":""}${isWk?" wknd":""}">
      <div class="cal-hd">

      </div>

        ${its.slice(0,2).map(d=>{const bc=CLR[d.rid]||"#e85d04",ga=getGer(d.ap?.gid);return`<div class="cal-pip" style="background:${bc}">${ga.n?(ga.n.replace("Gcc ","").replace("LCV ","")):"?"}</div>`}).join("")}
        ${its.length>2?`<div class="cal-more">+${its.length-2}</div>`:""}
      </div>
    </div>`;
  }
  grid+=`</div>`;
  return`<div class="pg">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <button onclick="CM--;if(CM<0){CM=11;CY--;}CDS=null;R()" style="background:var(--g);border:none;border-radius:10px;padding:9px 15px;cursor:pointer;font-size:18px;color:#475569">‹</button>
      <div style="text-align:center"><div style="font-size:16px;font-weight:800;text-transform:capitalize">${mn}</div><div style="font-size:11px;color:var(--s)">${dias.length} registro${dias.length!==1?"s":""}</div></div>
      <button onclick="CM++;if(CM>11){CM=0;CY++;}CDS=null;R()" style="background:var(--g);border:none;border-radius:10px;padding:9px 15px;cursor:pointer;font-size:18px;color:#475569">›</button>
    </div>
    ${ley}${det}
    <div class="card" style="padding:11px">${grid}</div>
  </div>`;
}

// ── MAPA ──
let _map=null;
function rMapa(){
  const pts=[];
  const fdias=gFDias();
  fdias.forEach(d=>{
    if(d.ap?.lat)pts.push({...d,tipo:"ap",lat:d.ap.lat,lng:d.ap.lng,hora:d.ap.hora,gid:d.ap.gid});
    if(d.ci?.lat)pts.push({...d,tipo:"ci",lat:d.ci.lat,lng:d.ci.lng,hora:d.ci.hora,gid:d.ci.gid});
  });
  const vis=MAP_F!==null?pts.filter(p=>p.rid===MAP_F):pts;
  setTimeout(()=>{
    const el=document.getElementById("mapa-div");if(!el||!vis.length)return;
    if(_map){_map.remove();_map=null}
    const al=vis.reduce((a,v)=>a+v.lat,0)/vis.length,ag=vis.reduce((a,v)=>a+v.lng,0)/vis.length;
    const lnk=document.createElement("link");lnk.rel="stylesheet";lnk.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";document.head.appendChild(lnk);
    const sc=document.createElement("script");sc.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    sc.onload=()=>{
      _map=L.map("mapa-div").setView([al,ag],13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap",maxZoom:19}).addTo(_map);
      vis.forEach(p=>{
        const col=CLR[p.rid]||"#e85d04",reg=getReg(p.rid),ger=getGer(p.gid);
        const icon=L.divIcon({className:"",html:`<div style="width:14px;height:14px;background:${col};border:2.5px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.3)"></div>`,iconSize:[14,14],iconAnchor:[7,7]});
        L.marker([p.lat,p.lng],{icon}).addTo(_map).bindPopup(`<div style="font-family:'Trebuchet MS',sans-serif;min-width:150px">
          <div style="font-size:11px;font-weight:700;color:${col};margin-bottom:3px">${reg.n} · ${p.tipo==="ap"?"🌅":"🌆"}</div>
          <div style="font-size:13px;font-weight:700;color:#1e293b">${ger.n}</div>
          <div style="font-size:11px;color:#64748b">${shD(p.fecha)}${p.hora?" · "+p.hora:""}</div>
          <a href="https://www.google.com/maps?q=${p.lat},${p.lng}" target="_blank" style="font-size:11px;color:#e85d04;font-weight:700;text-decoration:none;display:block;margin-top:5px">📌 Ver en Maps ↗</a>
        </div>`);
      });
      if(vis.length>1)_map.fitBounds(L.latLngBounds(vis.map(p=>[p.lat,p.lng])),{padding:[30,30]});
    };document.head.appendChild(sc);
  },200);
  return`<div class="pg" style="max-width:100%;padding:0">
    <div style="padding:14px 14px 0">
      ${pfWidget()}
      <div class="stats" style="margin-bottom:12px">
        <div class="stat"><div class="stat-n" style="color:var(--o)">${fdias.length}</div><div class="stat-l">Días</div></div>
        <div class="stat"><div class="stat-n" style="color:#16a34a">${pts.length}</div><div class="stat-l">Puntos GPS</div></div>
        <div class="stat"><div class="stat-n" style="color:var(--s)">${Math.max(0,fdias.length-Math.floor(pts.length/2))}</div><div class="stat-l">Sin GPS</div></div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
        <button onclick="MAP_F=null;rMapaView()" style="display:flex;align-items:center;gap:4px;border-radius:20px;padding:3px 10px;border:2px solid ${MAP_F===null?"#1e293b":"#e2e8f0"};background:${MAP_F===null?"#1e293b":"transparent"};cursor:pointer">
          <div style="width:6px;height:6px;border-radius:50%;background:${MAP_F===null?"#fff":"#1e293b"}"></div>
          <span style="font-size:10px;font-weight:700;color:${MAP_F===null?"#fff":"#1e293b"}">Todos</span>
        </button>
        ${REGS.map(r=>{const bc=CLR[r.id]||"#e85d04",n=pts.filter(p=>p.rid===r.id).length,act=MAP_F===r.id;
          return`<button onclick="MAP_F=${r.id};rMapaView()" style="display:flex;align-items:center;gap:4px;border-radius:20px;padding:3px 10px;border:2px solid ${act?bc:bc+"40"};background:${act?bc:"transparent"};cursor:pointer">
            <div style="width:6px;height:6px;border-radius:50%;background:${act?"#fff":bc}"></div>
            <span style="font-size:10px;font-weight:700;color:${act?"#fff":bc}">${r.n} <span style="font-size:9px;opacity:.7">${n}</span></span>
          </button>`}).join("")}
      </div>
    </div>
    ${pts.length===0
      ?`<div style="text-align:center;padding:40px 20px"><div style="font-size:38px;margin-bottom:12px">🗺️</div><div style="font-size:15px;font-weight:800;color:#1e293b;margin-bottom:6px">Sin ubicaciones GPS</div><div style="font-size:13px;color:#94a3b8">No hay puntos en <b>${perLbl()}</b>. Cambia el período arriba.</div></div>`
      :`<div id="mapa-div" style="height:calc(100vh - 200px);width:100%;min-height:320px"></div>
       <div style="padding:12px 14px">
         ${vis.slice().reverse().slice(0,10).map(p=>{const reg=getReg(p.rid),ger=getGer(p.gid),bc=CLR[p.rid]||"#e85d04";
           return`<div class="rrow" style="border-left-color:${bc};margin-bottom:7px">
             <div style="flex:1"><div style="font-size:10px;font-weight:700;color:${bc}">${reg.n} · ${p.tipo==="ap"?"🌅":"🌆"}</div><div style="font-size:13px;font-weight:700">${ger.n}</div></div>
             <div style="text-align:right;flex-shrink:0"><div style="font-size:11px;color:var(--s)">${shD(p.fecha)}${p.hora?" · "+p.hora:""}</div><a href="https://www.google.com/maps?q=${p.lat},${p.lng}" target="_blank" style="font-size:10px;color:var(--o);font-weight:700;text-decoration:none">Ver en Maps ↗</a></div>
           </div>`}).join("")}
       </div>`
    }
  </div>`;
}

// ── HORARIOS ──
function rHor(){
  const isA=SES.role==="admin",sesRid=isA?null:SES.rid;
  const diasBase=gFDias().filter(d=>isA?true:d.rid===sesRid);
  let dias=diasBase.filter(d=>isA?(HOR_F!==null?d.rid===HOR_F:true):d.rid===sesRid).sort((a,b)=>b.fecha>a.fecha?1:-1);
  // Filtrar solo tardanzas si está activo
  if(SHOW_TARD) dias=dias.filter(d=>{const m=pMin(d.ap?.hora);return m!==null&&m>LIM});
  const totT=dias.filter(d=>{const m=pMin(d.ap?.hora);return m!==null&&m>LIM}).length;
  const totSC=dias.filter(d=>d.ap&&!d.ci).length;
  // Días esperados del período (Lun-Sáb, nunca futuros) para detectar días sin registro
  const hoyDS=getHoy();
  function diasEsperados(){
    let ini=null,fin=null;
    if(SEL_DAY){ini=SEL_DAY;fin=SEL_DAY}
    else if(SEL_WEEK){ini=SEL_WEEK.start;fin=SEL_WEEK.end}
    else if(PER==="week"){const h=new Date(),dy=h.getDay(),mo=new Date(h);mo.setDate(h.getDate()-(dy===0?6:dy-1));const su=new Date(mo);su.setDate(mo.getDate()+6);ini=fd(mo);fin=fd(su)}
    else if(PER==="month"){const h=new Date();ini=fd(new Date(h.getFullYear(),h.getMonth(),1));fin=fd(new Date(h.getFullYear(),h.getMonth()+1,0))}
    if(!ini)return[];
    if(fin>hoyDS)fin=hoyDS;
    if(ini>fin)return[];
    const out=[];let c=pd(ini);const f=pd(fin);
    while(c<=f){if(c.getDay()!==0)out.push(fd(c));c=new Date(c.getTime()+86400000)}
    return out;
  }
  const DESP=diasEsperados();
  const regsStats=REGS.filter(r=>r.id!==0).map(r=>{
    const rd=diasBase.filter(d=>d.rid===r.id&&d.ap?.hora);
    const mins=rd.map(d=>pMin(d.ap.hora)).filter(m=>m!==null);
    const avgMin=mins.length?Math.round(mins.reduce((a,b)=>a+b,0)/mins.length):null;
    const tard=diasBase.filter(d=>d.rid===r.id&&pMin(d.ap?.hora)>LIM).length;
    const sinC=diasBase.filter(d=>d.rid===r.id&&d.ap&&!d.ci).length;
    const durs=diasBase.filter(d=>d.rid===r.id&&d.ap?.hora&&d.ci?.hora).map(d=>pMin(d.ci.hora)-pMin(d.ap.hora)).filter(d=>d>0);
    const avgDur=durs.length?Math.round(durs.reduce((a,b)=>a+b,0)/durs.length):null;
    const falt=DESP.filter(ds=>!diasBase.some(d=>d.rid===r.id&&d.fecha===ds));
    return{...r,avgMin,tard,sinC,avgDur,total:rd.length,falt};
  });
  const faltRegs=isA?(HOR_F!==null?regsStats.filter(r=>r.id===HOR_F):regsStats):regsStats.filter(r=>r.id===sesRid);
  const faltItems=[];faltRegs.forEach(r=>r.falt.forEach(ds=>faltItems.push({rid:r.id,fecha:ds})));
  faltItems.sort((a,b)=>b.fecha>a.fecha?1:b.fecha<a.fecha?-1:0);
  const totFalt=faltItems.length;
  function mToH(m){if(m===null)return"—";const h=Math.floor(m/60),mn=m%60,ap=h>=12?"p.m.":"a.m.",hh=h>12?h-12:h===0?12:h;return`${hh}:${String(mn).padStart(2,"0")} ${ap}`}
  return`<div class="pg">
    ${pfWidget()}
    <div class="stats" style="grid-template-columns:repeat(4,1fr);gap:7px">
      <div class="stat" onclick="SHOW_TARD=false;R()" style="cursor:pointer;border:2px solid ${!SHOW_TARD?"var(--o)":"transparent"};transition:all .15s">
        <div class="stat-n" style="color:var(--o);font-size:21px">${dias.length}</div><div class="stat-l">Registros</div></div>
      <div class="stat" onclick="SHOW_TARD=!SHOW_TARD;R()" style="cursor:pointer;border:2px solid ${SHOW_TARD?"#dc2626":"transparent"};background:${SHOW_TARD?"#fff1f2":"#fff"};transition:all .15s" title="Clic para ver solo tardanzas">
        <div class="stat-n" style="color:#dc2626;font-size:21px">${totT}</div>
        <div class="stat-l" style="color:${SHOW_TARD?"#dc2626":"var(--s)"}">⚠ Tarde${SHOW_TARD?" ✓":""}</div>
      </div>
      <div class="stat"><div class="stat-n" style="color:#d97706;font-size:21px">${totSC}</div><div class="stat-l">Sin cierre</div></div>
      <div class="stat" ${totFalt>0?`onclick="document.getElementById('sec-falt')&&document.getElementById('sec-falt').scrollIntoView({behavior:'smooth',block:'center'})" style="cursor:pointer;background:#f1f5f9;border:2px solid #94a3b8"`:`style="background:#f0fdf4;border:2px solid #86efac"`}>
        <div class="stat-n" style="color:${totFalt>0?"#475569":"#16a34a"};font-size:21px">${totFalt}</div><div class="stat-l">🚫 Sin registro</div></div>
    </div>
    ${SHOW_TARD?`<div style="background:#fff1f2;border:1.5px solid #fca5a5;border-radius:10px;padding:10px 13px;margin-bottom:12px;font-size:12px;color:#9f1239;display:flex;align-items:center;justify-content:space-between">
      <span>🔴 Mostrando solo registros con tardanza (después de 9:00 a.m.)</span>
      <button onclick="SHOW_TARD=false;R()" style="background:transparent;border:none;color:#dc2626;font-size:11px;font-weight:700;cursor:pointer;text-decoration:underline">× Quitar</button>
    </div>`:""}
    ${isA?`<div class="card" style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:var(--s);letter-spacing:.8px;text-transform:uppercase;margin-bottom:13px">Promedio por Regional</div>
      ${regsStats.map(r=>{const bc=CLR[r.id]||"#e85d04",tard=r.tard>0,sinC=r.sinC>0,nf=r.falt.length;
        return`<div onclick="HOR_F=HOR_F===${r.id}?null:${r.id};R()" style="display:flex;align-items:center;gap:11px;padding:10px;border-radius:10px;cursor:pointer;background:${HOR_F===r.id?bc+"15":"transparent"};border:1.5px solid ${HOR_F===r.id?bc:"transparent"};margin-bottom:6px;transition:all .15s">
          <div style="width:10px;height:10px;border-radius:50%;background:${bc};flex-shrink:0"></div>
          <div style="flex:1">
            <div style="font-size:13px;font-weight:700">${r.n}</div>
            <div style="display:flex;gap:10px;margin-top:3px;flex-wrap:wrap">
              <span style="font-size:11px;color:var(--s)">📊 ${r.total} días</span>
              ${r.avgMin!==null?`<span style="font-size:11px;font-weight:700;color:${r.avgMin>LIM?"#dc2626":"#16a34a"}">🌅 ${mToH(r.avgMin)}</span>`:""}
              ${r.avgDur!==null?`<span style="font-size:11px;color:var(--s)">⏱ ${Math.floor(r.avgDur/60)}h${r.avgDur%60>0?" "+r.avgDur%60+"min":""}</span>`:""}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
            ${tard?`<span style="background:#fee2e2;color:#dc2626;border-radius:20px;padding:2px 8px;font-size:9px;font-weight:700">⚠ ${r.tard} tarde${r.tard!==1?"s":""}</span>`:""}
            ${sinC?`<span style="background:#fef3c7;color:#d97706;border-radius:20px;padding:2px 8px;font-size:9px;font-weight:700">🔓 ${r.sinC} sin cierre</span>`:""}
            ${nf>0?`<span style="background:#e2e8f0;color:#475569;border-radius:20px;padding:2px 8px;font-size:9px;font-weight:700">🚫 ${nf} sin registro</span>`:""}
            ${!tard&&!sinC&&nf===0&&r.total>0?`<span style="background:#dcfce7;color:#16a34a;border-radius:20px;padding:2px 8px;font-size:9px;font-weight:700">✓ Al día</span>`:""}
          </div>
        </div>`}).join("")}
      ${HOR_F!==null?`<div style="text-align:center;margin-top:6px"><button onclick="HOR_F=null;R()" style="background:transparent;border:none;color:var(--o);font-size:11px;font-weight:700;cursor:pointer;text-decoration:underline">× Ver todos</button></div>`:""}
    </div>`:""}
    ${!SHOW_TARD&&DESP.length>0?`<div id="sec-falt" style="margin-bottom:16px">
      <div style="font-size:11px;font-weight:700;color:var(--s);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px">🚫 Días sin registro · ${perLbl()}</div>
      ${totFalt===0?`<div style="background:#f0fdf4;border:1.5px solid #86efac;border-radius:12px;padding:14px 15px;font-size:13px;color:#15803d;font-weight:700;text-align:center">✓ Todos los días del período tienen registro</div>`
      :`<div style="background:#f8fafc;border:1.5px solid #cbd5e1;border-radius:12px;padding:11px 13px;margin-bottom:10px;font-size:11px;color:#475569">
          Se revisaron <b>${DESP.length}</b> día${DESP.length!==1?"s":""} hábil${DESP.length!==1?"es":""} (lun–sáb, sin contar fechas futuras). Faltan <b>${totFalt}</b> registro${totFalt!==1?"s":""}.
        </div>
        ${faltItems.map(f=>{const rg=getReg(f.rid),bc=CLR[f.rid]||"#e85d04";
          const dl=pd(f.fecha).toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"});
          return`<div style="background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid ${bc};display:flex;align-items:center;gap:11px">
            <div style="width:34px;height:34px;min-width:34px;border-radius:50%;background:#f1f5f9;border:1.5px dashed #94a3b8;display:flex;align-items:center;justify-content:center;font-size:15px">🚫</div>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:700;color:${bc}">${rg.n}</div>
              <div style="font-size:11px;color:var(--s)">${cap1(dl)}</div>
            </div>

  const stale=GERS.map(g=>{const lv=lastVisitByGer(g.id);return{...g,last:lv?.fecha||null,days:lv?dateDiff(lv.fecha,today):999}}).sort((a,b)=>b.days-a.days);
  return{ds,tot,covered,late,noClose,gpsPct:events?Math.round(gpsEvents/events*100):0,stale};
}
function insightText(){
  const d=dashData(),scope=perLbl();
  if(!d.tot)return`No hay registros en ${scope.toLowerCase()}. La prioridad es iniciar captura consistente antes de interpretar tendencias.`;
  const worst=d.stale[0],latePct=Math.round(d.late/d.tot*100),closePct=Math.round((d.tot-d.noClose)/d.tot*100);
  let msg=`En ${scope.toLowerCase()} se registraron ${d.tot} días de supervisión y se cubrieron ${d.covered.size} de ${GERS.length} gerencias. `;
  msg+=d.noClose?`El ${closePct}% de los registros tiene cierre completo; quedan ${d.noClose} pendientes. `:`Todos los registros tienen cierre. `;
  msg+=d.late?`La tardanza representa ${latePct}% de los días. `:`No se detectaron aperturas posteriores a las 9:00 a.m. `;
  if(worst.days>=ALERT_DAYS)msg+=`${worst.n} requiere atención: ${worst.last?`su última visita fue hace ${worst.days} días`:`no tiene visitas registradas`}.`;
  else msg+=`La cobertura reciente no presenta gerencias por encima del umbral de ${ALERT_DAYS} días.`;
  return msg;
}
function rDash(){
  const d=dashData(),cov=Math.round(d.covered.size/GERS.length*100),eq=REGS.filter(r=>r.id!==0).map(r=>eqScore(r.id)).filter(x=>x!==null),avgEq=eq.length?Math.round(eq.reduce((a,b)=>a+b,0)/eq.length):0;
  const recent=d.ds.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,7);
  return`<div class="pg-w">${pfWidget()}
    <div class="insight"><div style="font-size:10px;letter-spacing:1px;font-weight:700;opacity:.65;margin-bottom:7px">LECTURA EJECUTIVA</div><div style="font-size:14px;line-height:1.55;font-weight:600">${insightText()}</div></div>
    <div class="kpi-grid">
      <div class="kpi" style="border-top-color:var(--o)"><div class="kpi-v" style="color:var(--o)">${d.tot}</div><div class="kpi-l">Días registrados</div></div>
      <div class="kpi" style="border-top-color:#16a34a"><div class="kpi-v" style="color:#16a34a">${cov}%</div><div class="kpi-l">Cobertura</div></div>

      <div class="kpi" style="border-top-color:${d.noClose?'#d97706':'#16a34a'}"><div class="kpi-v" style="color:${d.noClose?'#d97706':'#16a34a'}">${d.noClose}</div><div class="kpi-l">Sin cierre</div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px">
      <div class="card"><div style="font-size:12px;font-weight:800;margin-bottom:12px">Cobertura y calidad</div>
        ${[['GPS capturado',d.gpsPct,'#2563eb'],['Gerencias cubiertas',cov,'#16a34a'],['Puntualidad',d.tot?Math.round((d.tot-d.late)/d.tot*100):0,'#e85d04']].map(x=>`<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:5px"><span>${x[0]}</span><span>${x[1]}%</span></div><div class="bar-bg"><div class="bar" style="width:${x[1]}%;background:${x[2]}"></div></div></div>`).join('')}
      </div>
      <div class="card"><div style="font-size:12px;font-weight:800;margin-bottom:12px">Prioridades inmediatas</div>
        ${d.stale.slice(0,5).map((g,i)=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--g)"><div><div style="font-size:12px;font-weight:700">${i+1}. ${g.n}</div><div style="font-size:10px;color:var(--s)">${getReg(g.r).n}</div></div><span class="bdg" style="background:${g.days>=ALERT_DAYS?'#fee2e2':'#fef3c7'};color:${g.days>=ALERT_DAYS?'#dc2626':'#d97706'}">${g.last?g.days+' días':'Sin visita'}</span></div>`).join('')}
      </div>
    </div>
    <div class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-size:12px;font-weight:800">Últimos movimientos</div><button class="btn btn-g btn-sm" onclick="VIEW='ALERT';R()">Ver alertas</button></div>
      ${recent.length?recent.map(d=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--g);font-size:12px"><span><b>${getReg(d.rid).n}</b> · ${getGer(d.ap?.gid).n||'Sin apertura'}</span><span style="color:var(--s)">${shD(d.fecha)}</span></div>`).join(''):`<div style="color:var(--s);font-size:13px">Sin movimientos.</div>`}
    </div>
  </div>`;
}
function rAlerts(){
  const d=dashData(),stale=d.stale.filter(g=>g.days>=ALERT_DAYS),noGps=d.ds.filter(x=>(x.ap&&!x.ap.lat)||(x.ci&&!x.ci.lat)),late=d.ds.filter(x=>pMin(x.ap?.hora)>LIM),noClose=d.ds.filter(x=>x.ap&&!x.ci);
  const cards=[];
  stale.forEach(g=>cards.push({sev:'crit',title:g.n,txt:g.last?`Sin visita desde ${shD(g.last)} (${g.days} días).`:'No tiene visitas registradas.',act:`Priorizar en la próxima ruta de ${getReg(g.r).n}.`}));
  if(noClose.length)cards.push({sev:'crit',title:`${noClose.length} registros sin cierre`,txt:'La jornada quedó incompleta y afecta el cálculo de duración.',act:'Solicitar regularización y revisar el detalle en Horarios.'});
  if(late.length)cards.push({sev:'',title:`${late.length} aperturas tardías`,txt:'Se registraron después de las 9:00 a.m.',act:'Revisar recurrencia por regional antes de concluir incumplimiento.'});
  if(noGps.length)cards.push({sev:'',title:`${noGps.length} registros con GPS incompleto`,txt:'La ubicación pudo ser denegada, imprecisa o no disponible.',act:'Confirmar permisos de ubicación en los dispositivos.'});
  if(!cards.length)cards.push({sev:'ok',title:'Sin alertas críticas',txt:`No hay incidencias bajo el umbral actual de ${ALERT_DAYS} días.`,act:'Mantener la distribución y revisar nuevamente al cierre de semana.'});
  return`<div class="pg"><div class="card" style="margin-bottom:14px"><div style="font-size:15px;font-weight:800">Centro de alertas</div><div style="font-size:12px;color:var(--s);margin-top:4px">Umbral de gerencia sin visita</div><div style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="number" min="1" max="90" value="${ALERT_DAYS}" onchange="ALERT_DAYS=Math.max(1,parseInt(this.value)||14);R()"><span style="font-size:12px;font-weight:700">días</span></div></div>
    ${cards.map(c=>`<div class="alert ${c.sev}"><div style="font-size:13px;font-weight:800">${c.title}</div><div style="font-size:12px;color:#64748b;margin-top:4px;line-height:1.4">${c.txt}</div><div style="font-size:11px;font-weight:700;color:${c.sev==='crit'?'#dc2626':c.sev==='ok'?'#16a34a':'#d97706'};margin-top:7px">Acción: ${c.act}</div></div>`).join('')}
  </div>`;
}
function hav(a,b){const R=6371,p=Math.PI/180,d1=(b.lat-a.lat)*p,d2=(b.lng-a.lng)*p,x=Math.sin(d1/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function gerCoords(gid){const pts=[];gDias().forEach(d=>{if(d.ap?.gid===gid&&d.ap.lat)pts.push({lat:d.ap.lat,lng:d.ap.lng});if(d.ci?.gid===gid&&d.ci.lat)pts.push({lat:d.ci.lat,lng:d.ci.lng})});return pts.length?pts[pts.length-1]:null}
function routePlan(){
  let pool=GERS.filter(g=>ROUTE_RID===null||g.r===ROUTE_RID).map(g=>({...g,coord:gerCoords(g.id),last:lastVisitByGer(g.id)})).filter(g=>g.coord);
  pool.sort((a,b)=>((a.last?.fecha||'')>(b.last?.fecha||'')?1:-1));pool=pool.slice(0,6);if(!pool.length)return[];
  let out=[pool.shift()];while(pool.length){const cur=out[out.length-1],n=pool.map((g,i)=>({i,d:hav(cur.coord,g.coord)})).sort((a,b)=>a.d-b.d)[0];out.push(pool.splice(n.i,1)[0])}return out;
}
function rRoutes(){const r=routePlan();let km=0;for(let i=1;i<r.length;i++)km+=hav(r[i-1].coord,r[i].coord);
  return`<div class="pg"><div class="card" style="margin-bottom:14px"><div style="font-size:15px;font-weight:800">Ruta sugerida</div><div style="font-size:12px;color:var(--s);margin:4px 0 12px">Prioriza gerencias con visitas más antiguas y ordena por cercanía usando su última ubicación registrada.</div><select onchange="ROUTE_RID=this.value===''?null:parseInt(this.value);R()"><option value="">Todo el cuartel</option>${REGS.filter(x=>x.id!==0).map(x=>`<option value="${x.id}" ${ROUTE_RID===x.id?'selected':''}>${x.n}</option>`).join('')}</select></div>
    <div class="card">${r.length?`<div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>${r.length} paradas</b><span class="bdg" style="background:#fff7ed;color:var(--o)">≈ ${km.toFixed(1)} km entre puntos</span></div>${r.map((g,i)=>`<div class="route-step"><div class="route-num">${i+1}</div><div style="flex:1"><div style="font-size:13px;font-weight:800">${g.n}</div><div style="font-size:11px;color:var(--s)">${getReg(g.r).n} · Última visita: ${g.last?shD(g.last.fecha):'sin registro'}</div><a target="_blank" href="https://www.google.com/maps?q=${g.coord.lat},${g.coord.lng}" style="font-size:11px;color:var(--o);font-weight:700;text-decoration:none">Abrir ubicación ↗</a></div></div>`).join('')}<div style="font-size:10px;color:var(--s);margin-top:10px">La distancia es aproximada en línea recta; no sustituye navegación vial.</div>`:`<div style="text-align:center;color:var(--s);padding:24px">No hay suficientes ubicaciones históricas para construir la ruta.</div>`}</div>
  </div>`;
}
