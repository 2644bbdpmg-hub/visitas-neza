async function syncNow(forceRender=false){
  SYNCING=true;
  try {
    const data = await fbGet("dias");
    DIAS = data || {};
    LAST_SYNC = new Date();
    SYNCING=false;
    // Solo re-renderizar si NO está en el formulario de registro
    // o si se forzó (ej. después de guardar)
    if(SES && (VIEW !== "REG" || forceRender)){
      R();
    } else if(SES){
      // Solo actualizar el indicador de conexión sin tocar el formulario
      updateSyncIndicator();
    }
  } catch(e){
    SYNCING=false;
    if(SES) updateSyncIndicator();
  }
}

function updateSyncIndicator(){
  const el = document.getElementById("sync_indicator");
  if(!el) return;
  const syncCol = LAST_SYNC?"#16a34a":SYNCING?"#f59e0b":"#dc2626";
  const syncTxt = LAST_SYNC?"● En línea":SYNCING?"● Conectando...":"● Sin conexión";
  el.style.color = syncCol;
  el.textContent = syncTxt;
}

function startPoll(){
  stopPoll();
  syncNow();
  POLL_TIMER = setInterval(syncNow, 15000); // refresca cada 15 seg
}
function stopPoll(){
  if(POLL_TIMER){ clearInterval(POLL_TIMER); POLL_TIMER=null; }

function fd(d){return d.toISOString().split("T")[0];}
function pd(s){const[y,m,dd]=s.split("-").map(Number);return new Date(y,m-1,dd);}
function shD(s){return pd(s).toLocaleDateString("es-MX",{day:"2-digit",month:"short"});}
function hora(){return new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit",hour12:true});}
function getReg(id){return REGS.find(r=>r.id===id)||{};}
function getGer(id){return GERS.find(g=>g.id===id)||{};}
function gersByR(rid){return rid===0?GERS:GERS.filter(g=>g.r===rid);}
function dur(h1,h2){
  if(!h1||!h2)return null;
  const p=h=>{const[t,m]=h.replace(" a.m.","").replace(" p.m.","").split(":").map(Number);return(h.includes("p.m.")&&t!==12?t+12:t)*60+m;};
  const d=p(h2)-p(h1);if(d<=0)return null;
  const hr=Math.floor(d/60),mn=d%60;return hr>0?`${hr}h${mn>0?" "+mn+"min":""}`:`${mn}min`;
}
function visitCount(gid,rid){
  return getDias().filter(d=>d.rid===rid&&(d.ap?.gid===gid||d.ci?.gid===gid)).length;
}
function equityScore(rid){
  const gs=gersByR(rid);
  const c=gs.map(g=>visitCount(g.id,rid));
  const total=c.reduce((a,b)=>a+b,0);
  if(!total)return null;
  const avg=total/c.length;
  const std=Math.sqrt(c.reduce((a,b)=>a+Math.pow(b-avg,2),0)/c.length);
  return Math.max(0,Math.round(100-(std/avg*100)));
}
function sInfo(s){
  if(s===null)return{t:"Sin datos",c:"#94a3b8",bg:"#f1f5f9"};

  if(s>=45)return{t:"Parcial",c:"#d97706",bg:"#fef3c7"};
  return{t:"Concentrado",c:"#dc2626",bg:"#fee2e2"};
}
function bCol(n,mx){

}

function updG(){
  const rid=parseInt(document.getElementById("sR")?.value);
  const sel=document.getElementById("sG");
  if(isNaN(rid)){sel.innerHTML=`<option value="">— Elige regional primero —</option>`;return;}
  if(rid===0){

    REGS.filter(r=>r.id!==0).forEach(r=>{
      h+=`<optgroup label="${r.n}">${GERS.filter(g=>g.r===r.id).map(g=>`<option value="${g.id}">${g.n} · ${g.cod}</option>`).join("")}</optgroup>`;
    });
    sel.innerHTML=h;
  } else {
    sel.innerHTML=`<option value="">— Selecciona gerencia —</option>`+gersByR(rid).map(g=>`<option value="${g.id}">${g.n} · ${g.cod}</option>`).join("");
  }
}

async function guardar(){
  const isA=SES.role==="admin";
  const rid=isA?parseInt(document.getElementById("sR")?.value):SES.rid;
  const gid=parseInt(document.getElementById("sG")?.value);
  const fecha=document.getElementById("sF")?.value;
  const nota=document.getElementById("sN")?.value.trim()||"";
  if((isNaN(rid)||(!rid&&rid!==0))||!gid||!fecha){showT("Completa los campos","#dc2626");return;}

  const btn=document.querySelector("#root button[onclick='guardar()']");
  if(btn){btn.disabled=true;btn.textContent="Guardando...";}

  const h=hora();
  // Capturar GPS en silencio (no bloquea el guardado)
  let lat=null,lng=null;
  try {
    const pos = await new Promise((res,rej)=>
      navigator.geolocation?.getCurrentPosition(res,rej,{timeout:4000,maximumAge:0,enableHighAccuracy:true})
    );
    lat=parseFloat(pos.coords.latitude.toFixed(6));
    lng=parseFloat(pos.coords.longitude.toFixed(6));
  } catch(e){ /* sin GPS, continúa igual */ }

  try {
    const ex=getDias().find(d=>d.rid===rid&&d.fecha===fecha);
    const puntoGPS=lat?{lat,lng}:null;
    if(TIPO==="ap"){
      if(ex) await fbPatch(`dias/${ex._k}`,{ap:{gid,hora:h,...(puntoGPS&&{lat:puntoGPS.lat,lng:puntoGPS.lng})}});
      else await fbPost("dias",{rid,fecha,nota,ap:{gid,hora:h,...(puntoGPS&&{lat:puntoGPS.lat,lng:puntoGPS.lng})},ci:null});
      showT("🌅 Apertura registrada","#e85d04");
    } else {
      if(ex) await fbPatch(`dias/${ex._k}`,{ci:{gid,hora:h,...(puntoGPS&&{lat:puntoGPS.lat,lng:puntoGPS.lng})}});
      else await fbPost("dias",{rid,fecha,nota,ap:null,ci:{gid,hora:h,...(puntoGPS&&{lat:puntoGPS.lat,lng:puntoGPS.lng})}});
      showT("🌆 Cierre registrado","#2563eb");
    }
    await syncNow(true);
  } catch(e){
    showT("⚠ Error al guardar. Verifica conexión","#dc2626");
    if(btn){btn.disabled=false;btn.textContent=TIPO==="ap"?"🌅 Registrar Apertura":"🌆 Registrar Cierre";}
  }
}

async function delDia(key){
  try{
    await fbDelete(`dias/${key}`);
    await syncNow(true);
    showT("Registro eliminado","#94a3b8");

}

    const sc=equityScore(r.id),si=sInfo(sc);
    const cs=gersByR(r.id).map(g=>({...g,v:visitCount(g.id,r.id)})).sort((a,b)=>b.v-a.v);
    const mx=Math.max(...cs.map(c=>c.v),1),mn=Math.min(...cs.map(c=>c.v));
    const tot=cs.reduce((a,b)=>a+b.v,0);
    return`<div class="card" style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px;">

      </div>
      <div class="div"></div>
      ${cs.map((g,i)=>{

                ${isLow&&g.v===0&&tot>0?`<span class="badge" style="background:#dcfce7;color:#16a34a;margin-left:4px;font-size:9px;">sin visitas</span>`:""}
                ${isLow&&g.v>0&&!isTop?`<span class="badge" style="background:#fef3c7;color:#d97706;margin-left:4px;font-size:9px;">↓ menos</span>`:""}

        return"";
      })()}
    </div>`;
  }).join("")}</div>`;
}

      </div>`;}).join("")}
  </div>`;

  const dows=["L","M","X","J","V","S","D"];
  let grid=`<div class="cal-grid" style="margin-bottom:4px;">${dows.map(d=>`<div class="cal-head">${d}</div>`).join("")}</div><div class="cal-grid">`;
  for(let i=0;i<sdow;i++) grid+=`<div class="cal-cell empty"></div>`;
  for(let day=1;day<=total;day++){
    const ds=CY+"-"+String(CM+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
    const its=byD[ds]||[];
    const isTod=ds===todayS,isSel=ds===CDS,isWk=((sdow+day-1)%7)>=5;
    grid+=`<div onclick="CDS='${ds}';R()" class="cal-cell${isTod||isSel?" today":""}${isSel?" sel":""}${isWk?" wknd":""}">
      <div class="cal-n${isTod?" hoy":isWk?" wk":""}">${day}</div>
      ${its.slice(0,2).map(d=>{const bc=COLORS[d.rid]||"#e85d04";const ga=getGer(d.ap?.gid);
        return`<div class="cal-pip" style="background:${bc};">${ga.n?(ga.n.replace("Gcc ","").replace("LCV ","")):"?"}</div>`;}).join("")}
      ${its.length>2?`<div style="font-size:8px;color:var(--sub);font-weight:700;text-align:center;">+${its.length-2}</div>`:""}
      ${its.length>0?`<div class="cal-badge">${its.length}</div>`:""}
    </div>`;
  }
  grid+=`</div>`;
  return`<div class="page">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <button onclick="CM--;if(CM<0){CM=11;CY--;}CDS=null;R()" style="background:var(--gris);border:none;border-radius:10px;padding:10px 16px;cursor:pointer;font-size:18px;color:#475569;">‹</button>
      <div style="text-align:center;"><div style="font-size:16px;font-weight:800;text-transform:capitalize;">${mn}</div><div style="font-size:11px;color:var(--sub);">${dias.length} registro${dias.length!==1?"s":""}</div></div>
      <button onclick="CM++;if(CM>11){CM=0;CY++;}CDS=null;R()" style="background:var(--gris);border:none;border-radius:10px;padding:10px 16px;cursor:pointer;font-size:18px;color:#475569;">›</button>
    </div>
    ${ley}${detail}
    <div class="card" style="padding:12px;">${grid}</div>
  </div>`;
}

// ══════════════════════════════════════
//  RESUMEN
// ══════════════════════════════════════
function renderRes(){
  const dias=getDias(),tot=dias.length;
  const ac=GERS.map(g=>{const v=dias.filter(d=>d.ap?.gid===g.id||d.ci?.gid===g.id).length;return{...g,v};}).sort((a,b)=>b.v-a.v);
  const sv=ac.filter(g=>g.v===0),cv=ac.filter(g=>g.v>0);
  return`<div class="page">
    <div class="stats">
      <div class="stat"><div class="stat-n" style="color:var(--naranja);">${tot}</div><div class="stat-l">Total días</div></div>
      <div class="stat"><div class="stat-n" style="color:#16a34a;">${cv.length}/${GERS.length}</div><div class="stat-l">Cubiertas</div></div>
      <div class="stat"><div class="stat-n" style="color:${sv.length>0?"#dc2626":"#16a34a"};">${sv.length}</div><div class="stat-l">Sin visitar</div></div>
    </div>
    <div class="card" style="margin-bottom:14px;">
      <div style="font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.8px;text-transform:uppercase;margin-bottom:14px;">Índice de Equidad</div>
      ${REGS.filter(r=>r.id!==0).map(r=>{const sc=equityScore(r.id),si=sInfo(sc),t=dias.filter(d=>d.rid===r.id).length;
        return`<div style="margin-bottom:13px;">
          <div style="display:flex;justify-content:space-between;margin-bottom:5px;">
            <div><span style="font-size:13px;font-weight:700;">${r.n}</span><span style="font-size:11px;color:var(--sub);margin-left:6px;">${t} días</span></div>
            <div style="display:flex;align-items:center;gap:7px;">
              <span style="font-size:13px;font-weight:800;color:${si.c};">${sc!==null?sc+"%":"—"}</span>
              <span class="badge" style="background:${si.bg};color:${si.c};">${si.t}</span>
            </div>
          </div>
          <div class="bar-bg" style="height:6px;"><div class="bar" style="width:${sc||0}%;background:${si.c};"></div></div>
        </div>`;}).join("")}
      <div style="font-size:10px;color:#cbd5e1;margin-top:8px;">100% = distribución perfecta · menos de 45% = alta concentración</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
      <div class="card">
        <div style="font-size:10px;font-weight:700;color:#dc2626;letter-spacing:.8px;text-transform:uppercase;margin-bottom:12px;">🔴 Más visitadas</div>
        ${cv.slice(0,5).map(g=>`<div style="display:flex;justify-content:space-between;margin-bottom:9px;">
          <div><div style="font-size:12px;font-weight:700;">${g.n}</div><div style="font-size:10px;color:var(--sub);">${getReg(g.r).n}</div></div>
          <span style="font-size:15px;font-weight:800;color:#dc2626;">${g.v}</span>
        </div>`).join("")||`<div style="color:#cbd5e1;font-size:12px;">Sin datos</div>`}
      </div>
      <div class="card">
        <div style="font-size:10px;font-weight:700;color:#16a34a;letter-spacing:.8px;text-transform:uppercase;margin-bottom:12px;">🟢 Menos visitadas</div>
        ${(sv.length>0?sv:ac.slice().reverse()).slice(0,5).map(g=>`<div style="display:flex;justify-content:space-between;margin-bottom:9px;">
          <div><div style="font-size:12px;font-weight:700;">${g.n}</div><div style="font-size:10px;color:var(--sub);">${getReg(g.r).n}</div></div>
          <span style="font-size:15px;font-weight:800;color:${g.v===0?"#94a3b8":"#16a34a"};">${g.v}</span>
        </div>`).join("")||`<div style="color:#cbd5e1;font-size:12px;">Sin datos</div>`}
      </div>
    </div>
    <div class="card">
      <div style="font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.8px;text-transform:uppercase;margin-bottom:14px;">Opciones</div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="btn btn-g" onclick="exportCSV()">📊 Exportar CSV</button>
        <button class="btn btn-g" onclick="openPins()">🔒 Cambiar PINs</button>
        <button class="btn btn-r" onclick="confReset()">🗑 Borrar todos los registros</button>
      </div>
    </div>
  </div>`;
}

// ══════════════════════════════════════
//  UTILIDADES
// ══════════════════════════════════════
function showM(html){const m=document.getElementById("modal");m.classList.add("show");m.innerHTML=`<div class="modal-box">${html}</div>`;}
function closeM(){document.getElementById("modal").classList.remove("show");}
function openPins(){
  const roles=[{k:"admin",l:"DOZ"},...REGS.filter(r=>r.id!==0).map(r=>({k:String(r.id),l:r.n}))];
  showM(`<div style="font-size:16px;font-weight:800;margin-bottom:4px;">🔒 Cambiar PINs</div>
    <div style="font-size:13px;color:var(--sub);margin-bottom:18px;">4 dígitos por usuario</div>
    ${roles.map(r=>`<div style="margin-bottom:13px;"><span class="lbl">${r.l}</span>
      <input type="password" id="p_${r.k}" maxlength="4" placeholder="••••" value="${PINS[r.k]||""}" style="text-align:center;letter-spacing:6px;font-size:18px;"></div>`).join("")}
    <button class="btn btn-o" style="margin-top:8px;" onclick="savePins2()">✓ Guardar</button>
    <button class="btn btn-g" style="margin-top:8px;" onclick="closeM()">Cancelar</button>`);
}
function savePins2(){
  ["admin","1","2","3","4","5"].forEach(k=>{const v=document.getElementById("p_"+k)?.value;if(v&&/^\d{4}$/.test(v))PINS[k]=v;});
  svP();closeM();showT("✓ PINs actualizados","#16a34a");
}
function confReset(){
  showM(`<div style="text-align:center;">
    <div style="font-size:36px;margin-bottom:10px;">⚠️</div>
    <div style="font-size:16px;font-weight:800;margin-bottom:6px;">¿Borrar todo?</div>
    <div style="font-size:13px;color:#64748b;margin-bottom:20px;">Se eliminarán todos los registros. No se puede deshacer.</div>
    <button class="btn btn-o" onclick="doReset()">Sí, borrar todo</button>
    <button class="btn btn-g" style="margin-top:8px;" onclick="closeM()">Cancelar</button>
  </div>`);
}
async function doReset(){
  try{await fbDelete("dias");await syncNow();closeM();showT("Datos eliminados","#dc2626");}
  catch(e){showT("⚠ Error al borrar","#dc2626");}
}
function exportCSV(){
  const dias=getDias();
  if(!dias.length){showT("Sin registros","#dc2626");return;}
  let csv="Fecha,Regional,Ger.Apertura,Cod,Hora Apertura,Ger.Cierre,Cod,Hora Cierre,Tiempo,Nota\n";
  dias.sort((a,b)=>a.fecha>b.fecha?1:-1).forEach(d=>{
    const reg=getReg(d.rid),ga=getGer(d.ap?.gid),gc=d.ci?getGer(d.ci.gid):{};
    const t=dur(d.ap?.hora,d.ci?.hora)||"";
    csv+=`"${d.fecha}","${reg.n}","${ga.n||""}","${ga.cod||""}","${d.ap?.hora||""}","${gc.n||""}","${gc.cod||""}","${d.ci?.hora||""}","${t}","${d.nota||""}"\n`;
  });
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"}));
  a.download="visitas_"+fd(new Date())+".csv";a.click();showT("✓ CSV descargado","#16a34a");
}
function showT(msg,bg="#16a34a"){
  const t=document.getElementById("toast");
  t.style.cssText=`display:block;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:${bg};border-radius:24px;padding:12px 22px;color:#fff;font-size:13px;font-weight:700;z-index:300;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.2);`;
  t.textContent=msg;setTimeout(()=>{t.style.display="none";},2500);
}


// ══════════════════════════════════════
//  MAPA (solo DOZ)
// ══════════════════════════════════════
function renderMapa(){
  const dias=getDias();
  const pts=[];
  dias.forEach(d=>{
    if(d.ap?.lat) pts.push({...d,tipo:"apertura",lat:d.ap.lat,lng:d.ap.lng,hora:d.ap.hora,gid:d.ap.gid});
    if(d.ci?.lat) pts.push({...d,tipo:"cierre",lat:d.ci.lat,lng:d.ci.lng,hora:d.ci.hora,gid:d.ci.gid});
  });
  const total=dias.length, conGPS=pts.length, sinGPS=total-Math.floor(conGPS/2);

  setTimeout(()=>{
    if(!pts.length) return;
    const mapEl=document.getElementById("mapa-div");
    if(!mapEl||mapEl._map) return;
    const avgLat=pts.reduce((a,v)=>a+v.lat,0)/pts.length;
    const avgLng=pts.reduce((a,v)=>a+v.lng,0)/pts.length;

    // Cargar Leaflet dinámicamente
    const link=document.createElement("link");
    link.rel="stylesheet";link.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    document.head.appendChild(link);
    const script=document.createElement("script");
    script.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    script.onload=()=>{
      const map=L.map("mapa-div").setView([avgLat,avgLng],13);
      mapEl._map=map;
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap",maxZoom:19}).addTo(map);
      pts.forEach(p=>{
        const col=COLORS[p.rid]||"#e85d04";
        const icon=L.divIcon({className:"",
          html:`<div style="width:${p.tipo==="apertura"?14:12}px;height:${p.tipo==="apertura"?14:12}px;background:${col};border:2.5px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.3);"></div>`,
          iconSize:[14,14],iconAnchor:[7,7]
        });
        const reg=getReg(p.rid),ger=getGer(p.gid);
        const gmaps=`https://www.google.com/maps?q=${p.lat},${p.lng}`;
        L.marker([p.lat,p.lng],{icon}).addTo(map)
          .bindPopup(`<div style="font-family:'Trebuchet MS',sans-serif;min-width:160px;">
            <div style="font-size:11px;font-weight:700;color:${col};margin-bottom:4px;">${reg.n} · ${p.tipo==="apertura"?"🌅 Apertura":"🌆 Cierre"}</div>
            <div style="font-size:13px;font-weight:700;color:#1e293b;">${ger.n}</div>
            <div style="font-size:11px;color:#64748b;margin-top:2px;">${shD(p.fecha)} · ${p.hora||""}</div>
            <a href="${gmaps}" target="_blank" style="font-size:11px;color:#e85d04;font-weight:700;text-decoration:none;display:block;margin-top:6px;">📌 Ver en Google Maps ↗</a>
          </div>`);
      });
      if(pts.length>1) map.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lng])),{padding:[30,30]});
    };
    document.head.appendChild(script);
  },200);

  return`<div class="page" style="max-width:100%;padding:0;">
    <div style="padding:16px 16px 0;">
      <div class="stats" style="margin-bottom:14px;">
        <div class="stat"><div class="stat-n" style="color:var(--naranja);">${total}</div><div class="stat-l">Días reg.</div></div>
        <div class="stat"><div class="stat-n" style="color:#16a34a;">${conGPS}</div><div class="stat-l">Puntos GPS</div></div>
        <div class="stat"><div class="stat-n" style="color:var(--sub);">${sinGPS}</div><div class="stat-l">Sin GPS</div></div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">
        ${REGS.map(r=>{const bc=COLORS[r.id]||"#e85d04";const n=pts.filter(p=>p.rid===r.id).length;
          return`<div style="display:flex;align-items:center;gap:4px;border-radius:20px;padding:3px 9px;background:${bc}18;border:1px solid ${bc}40;">
            <div style="width:6px;height:6px;border-radius:50%;background:${bc};"></div>
            <span style="font-size:10px;font-weight:700;color:${bc};">${r.n}</span>
            <span style="font-size:9px;color:var(--sub);">${n}</span>
          </div>`;}).join("")}
      </div>
    </div>
    ${pts.length===0
      ?`<div style="text-align:center;padding:48px 24px;">
          <div style="font-size:40px;margin-bottom:14px;">🗺️</div>
          <div style="font-size:15px;font-weight:800;color:#1e293b;margin-bottom:6px;">Sin ubicaciones GPS aún</div>
          <div style="font-size:13px;color:#94a3b8;">Las ubicaciones se capturan automáticamente al registrar. El navegador pedirá permiso de ubicación la primera vez.</div>
        </div>`
      :`<div id="mapa-div" style="height:calc(100vh - 220px);width:100%;min-height:350px;"></div>
       <div style="padding:14px 16px;">
         <div style="font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px;">Últimas ubicaciones</div>
         ${pts.slice().reverse().slice(0,10).map(p=>{
           const reg=getReg(p.rid),ger=getGer(p.gid),bc=COLORS[p.rid]||"#e85d04";
           return`<div class="rrow" style="border-left-color:${bc};margin-bottom:7px;">
             <div style="flex:1;">
               <div style="font-size:10px;font-weight:700;color:${bc};">${reg.n} · ${p.tipo==="apertura"?"🌅":"🌆"} ${p.tipo==="apertura"?"Apertura":"Cierre"}</div>
               <div style="font-size:13px;font-weight:700;">${ger.n} <span style="font-size:10px;color:var(--sub);">${ger.cod}</span></div>
             </div>
             <div style="text-align:right;flex-shrink:0;">
               <div style="font-size:11px;color:var(--sub);">${shD(p.fecha)} · ${p.hora||""}</div>
               <a href="https://www.google.com/maps?q=${p.lat},${p.lng}" target="_blank" style="font-size:10px;color:var(--naranja);font-weight:700;text-decoration:none;">Ver en Maps ↗</a>
             </div>
           </div>`;
         }).join("")}
       </div>`
    }
  </div>`;
}

// ══════════════════════════════════════
//  RENDER
// ══════════════════════════════════════
function switchTab(v){
  VIEW=v;
  if(v==="REG") syncNow(true); // al volver a registro, sincronizar y mostrar datos frescos
  else R();
}
function R(){
  if(!SES){renderLogin();return;}
  const isA=SES.role==="admin",nm=isA?"DOZ":getReg(SES.rid).n;
  const syncCol=LAST_SYNC?"#16a34a":SYNCING?"#f59e0b":"#dc2626";
  const syncTxt=LAST_SYNC?`● En línea`:SYNCING?"● Conectando...":"● Sin conexión";
  const tabs=isA
    ?[["REG","📋 Registro"],["DIST","📊 Distribución"],["CAL","📅 Calendario"],["MAP","🗺️ Mapa"],["RES","🏆 Resumen"]]
    :[["REG","📋 Registro"],["DIST","📊 Distribución"],["CAL","📅 Calendario"]];
  const vc=VIEW==="REG"?renderReg():VIEW==="DIST"?renderDist():VIEW==="CAL"?renderCal():VIEW==="MAP"?renderMapa():renderRes();
  Q("root",`
  <div class="header">
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="logo">📍</div>
      <div>
        <div style="font-size:14px;font-weight:800;">Supervisión de Visitas</div>
        <div id="sync_indicator" style="font-size:10px;color:${syncCol};font-weight:600;">${syncTxt}</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="font-size:12px;font-weight:700;">${nm}</span>
      <button class="btn btn-g btn-sm" onclick="logout()">Salir</button>
    </div>
  </div>
  <div class="tabs">${tabs.map(([v,l])=>`<button class="tab ${VIEW===v?"on":""}" onclick="switchTab('${v}')">${l}</button>`).join("")}</div>
  ${vc}
  <div style="text-align:center;padding:16px;font-size:10px;color:#cbd5e1;letter-spacing:.8px;">CUARTEL NEZAHUALCÓYOTL · 5 REGIONALES · 34 GERENCIAS</div>`);
}

// ══════════════════════════════════════
//  ARRANQUE
// ══════════════════════════════════════
if(SES){ R(); startPoll(); } else { R(); }
</script>
