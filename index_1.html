function fd(d){return d.toISOString().split("T")[0]}
function pd(s){const[y,m,dd]=s.split("-").map(Number);return new Date(y,m-1,dd)}
function shD(s){return pd(s).toLocaleDateString("es-MX",{day:"2-digit",month:"short"})}

function grByR(rid){return rid===0?GERS:GERS.filter(g=>g.r===rid)}
function gDias(){return Object.entries(DIAS).map(([k,v])=>({...v,_k:k}))}
function gFDias(){
  const all=gDias();
  // Filtro por día específico
  if(SEL_DAY) return all.filter(d=>d.fecha===SEL_DAY);
  // Filtro por semana operativa seleccionada
  if(SEL_WEEK){
    return all.filter(d=>d.fecha>=SEL_WEEK.start&&d.fecha<=SEL_WEEK.end);
  }
  if(PER==="all")return all;
  const h=new Date();
  if(PER==="month"){const y=h.getFullYear(),m=h.getMonth();return all.filter(d=>{const dt=pd(d.fecha);return dt.getFullYear()===y&&dt.getMonth()===m})}
  if(PER==="week"){const dy=h.getDay(),mo=new Date(h);mo.setDate(h.getDate()-(dy===0?6:dy-1));mo.setHours(0,0,0,0);const su=new Date(mo);su.setDate(mo.getDate()+6);su.setHours(23,59,59,999);return all.filter(d=>{const dt=pd(d.fecha);return dt>=mo&&dt<=su})}
  return all;
}
function gDiaHoy(rid){return gDias().find(d=>d.rid===rid&&d.fecha===HOY)||null}
function pMin(h){if(!h)return null;const[t,m]=h.replace(" a.m.","").replace(" p.m.","").split(":").map(Number);return(h.includes("p.m.")&&t!==12?t+12:t)*60+m}
// ── Semanas ISO ──
function getISOWeek(d){
  const dt=new Date(d.getTime());dt.setHours(0,0,0,0);
  dt.setDate(dt.getDate()+4-(dt.getDay()||7));
  const y=new Date(dt.getFullYear(),0,1);
  return{week:Math.ceil(((dt-y)/86400000+1)/7),year:dt.getFullYear()};
}
function getWeekRange(year,week){
  const jan4=new Date(year,0,4);
  const startOfW1=new Date(jan4);startOfW1.setDate(jan4.getDate()-(jan4.getDay()||7)+1);
  const start=new Date(startOfW1);start.setDate(startOfW1.getDate()+(week-1)*7);
  const end=new Date(start);end.setDate(start.getDate()+6);
  return{start:fd(start),end:fd(end)};
}
function weeksInYear(year){
  const dec28=new Date(year,11,28);return getISOWeek(dec28).week;
}
function dur(h1,h2){
  if(!h1||!h2)return null;
  const d=pMin(h2)-pMin(h1);if(d<=0)return null;
  const hr=Math.floor(d/60),mn=d%60;return hr>0?`${hr}h${mn>0?" "+mn+"min":""}`:`${mn}min`
}
function vcnt(gid,rid){return gFDias().filter(d=>d.rid===rid&&(d.ap?.gid===gid||d.ci?.gid===gid)).length}
function eqScore(rid){
  const gs=grByR(rid),c=gs.map(g=>vcnt(g.id,rid)),tot=c.reduce((a,b)=>a+b,0);
  if(!tot)return null;
  const avg=tot/c.length,std=Math.sqrt(c.reduce((a,b)=>a+Math.pow(b-avg,2),0)/c.length);
  return Math.max(0,Math.round(100-(std/avg*100)));
}

function setSemana(week,year){
  const w=parseInt(week),y=parseInt(year);
  const range=getWeekRange(y,w);
  SEL_WEEK={week:w,year:y,...range};
  SEL_DAY=null;PER="all";SHOW_TARD=false;R();

function setDia(fecha){
  if(!fecha){SEL_DAY=null;R();return}
  SEL_DAY=fecha;SEL_WEEK=null;PER="all";SHOW_TARD=false;R();

function perLbl(){
  if(SEL_DAY) return shD(SEL_DAY);
  if(SEL_WEEK) return `Semana ${SEL_WEEK.week} (${shD(SEL_WEEK.start)} - ${shD(SEL_WEEK.end)})`;

function setR(r){LS={role:r,pin:"",err:false};rLogin()}
function addP(d){if(LS.pin.length>=4)return;LS.pin+=d;LS.err=false;if(LS.pin.length===4)setTimeout(chkP,120);else rLogin()}
function delP(){LS.pin=LS.pin.slice(0,-1);LS.err=false;rLogin()}
function chkP(){
  const{role,pin}=LS,ok=role==="admin"?PINS.admin:(PINS[role]||DP[role]);
  if(pin===ok){svS({role:role==="admin"?"admin":"reg",rid:role==="admin"?null:parseInt(role)});LS={role:null,pin:"",err:false};VIEW="REG";R();startP()}
  else{LS.pin="";LS.err=true;rLogin()}
}

        <div style="font-size:11px;font-weight:700;color:var(--o);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px">Tu día de hoy</div>

            <div style="font-size:9px;font-weight:700;color:var(--b);letter-spacing:.8px;margin-bottom:3px">🌆 CIERRE</div>
            <div style="font-size:13px;font-weight:700">${gc?gc.n:"Pendiente"}</div>

    }

    <div class="card">
      <div class="tipo-wrap">
        <button class="tipo-btn ${TIPO==="ap"?"ap":""}" onclick="TIPO='ap';R()" ${(()=>{if(!isA){const d=gDiaHoy(rid);return d?.ap?"disabled style='opacity:.5;cursor:not-allowed'":""} return ""})()}>🌅 Apertura</button>
        <button class="tipo-btn ${TIPO==="ci"?"ci":""}" onclick="${(()=>{
          if(!isA){const d=gDiaHoy(rid);if(!d?.ap)return "showT('⚠ Primero registra la Apertura','#dc2626')";if(d?.ci)return "showT('⚠ Ya registraste el cierre de hoy','#d97706')"}

      </div>
      ${(()=>{
        if(!isA){
          const d=gDiaHoy(rid);
          if(!d?.ap) return `<div style="background:#fff7ed;border:1.5px solid #fed7aa;border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:12px;color:#92400e;">⚠️ Debes registrar <b>Apertura</b> primero antes de poder registrar el Cierre.</div>`;

      ${isA?`<span class="lbl" style="margin-top:0">Regional</span>

      <button class="btn" style="background:${TIPO==="ap"?"var(--o)":"var(--b)"};color:#fff" onclick="guardar()">

        <div style="display:flex;align-items:center;gap:8px">
          <span id="si" style="font-size:11px;font-weight:600;color:${sc}">${sync}</span>
          <button onclick="syncNow(true)" style="background:var(--g);border:1.5px solid var(--br);border-radius:7px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--s);cursor:pointer">↻</button>

function updG(){
  const rid=parseInt(document.getElementById("sR")?.value),sel=document.getElementById("sG");
  if(isNaN(rid)){sel.innerHTML=`<option value="">— Elige regional primero —</option>`;return}
  if(rid===0){let h=`<option value="">— Selecciona gerencia —</option>`;REGS.filter(r=>r.id!==0).forEach(r=>{h+=`<optgroup label="${r.n}">${GERS.filter(g=>g.r===r.id).map(g=>`<option value="${g.id}">${g.n} · ${g.cod}</option>`).join("")}</optgroup>`});sel.innerHTML=h}
  else sel.innerHTML=`<option value="">— Selecciona gerencia —</option>`+grByR(rid).map(g=>`<option value="${g.id}">${g.n} · ${g.cod}</option>`).join("");
}
async function guardar(){
  const isA=SES.role==="admin",rid=isA?parseInt(document.getElementById("sR")?.value):SES.rid;
  const gid=parseInt(document.getElementById("sG")?.value),nota=document.getElementById("sN")?.value.trim()||"";
  const fecha=HOY; // Siempre fecha de hoy — no se puede cambiar
  if((isNaN(rid)||(!rid&&rid!==0))||!gid){showT("Completa los campos","#dc2626");return}

  // Validar que solo se registre hoy
  const hoyReal=fd(new Date());
  if(fecha!==hoyReal){showT("⚠ Solo puedes registrar en la fecha de hoy","#dc2626");return}

  // Validar: no puede registrar Cierre sin Apertura previa
  if(TIPO==="ci"){
    const dHoy=gDias().find(d=>d.rid===rid&&d.fecha===HOY);
    if(!dHoy||!dHoy.ap){
      showT("⚠ Debes registrar Apertura antes del Cierre","#dc2626");
      // Cambiar automáticamente a apertura
      TIPO="ap";R();return;
    }
    // Validar que no tenga ya cierre registrado
    if(dHoy.ci){showT("⚠ Ya registraste el cierre de hoy","#d97706");return}
  }

  // Validar que apertura no esté ya registrada
  if(TIPO==="ap"){
    const dHoy=gDias().find(d=>d.rid===rid&&d.fecha===HOY);
    if(dHoy?.ap){showT("⚠ Ya registraste la apertura de hoy","#d97706");return}
  }
  const btn=document.querySelector("button[onclick='guardar()']");
  if(btn){btn.disabled=true;btn.textContent="Guardando..."}
  const h=hora();
  let lat=null,lng=null;
  try{const pos=await new Promise((res,rej)=>navigator.geolocation?.getCurrentPosition(res,rej,{timeout:4000,maximumAge:0,enableHighAccuracy:true}));lat=parseFloat(pos.coords.latitude.toFixed(6));lng=parseFloat(pos.coords.longitude.toFixed(6))}catch(e){}
  try{
    const ex=gDias().find(d=>d.rid===rid&&d.fecha===fecha);
    const gps=lat?{lat,lng}:null;
    if(TIPO==="ap"){
      const ap={gid,hora:h,...(gps&&{lat:gps.lat,lng:gps.lng})};
      if(ex)await fbU(`dias/${ex._k}`,{ap});else await fbP("dias",{rid,fecha,nota,ap,ci:null});
      showT("🌅 Apertura registrada","#e85d04");
    } else {
      const ci={gid,hora:h,...(gps&&{lat:gps.lat,lng:gps.lng})};
      if(ex)await fbU(`dias/${ex._k}`,{ci});else await fbP("dias",{rid,fecha,nota,ap:null,ci});
      showT("🌆 Cierre registrado","#2563eb");
    }
    await syncNow(true);
  }catch(e){showT("⚠ Error al guardar","#dc2626");if(btn){btn.disabled=false;btn.textContent=TIPO==="ap"?"🌅 Registrar Apertura":"🌆 Registrar Cierre"}}
}
async function delDia(key){try{await fbD(`dias/${key}`);await syncNow(true);showT("Registro eliminado","#94a3b8")}catch(e){showT("⚠ Error","#dc2626")}}
function rUlt(isA,rid){
  const list=gFDias().filter(d=>isA?true:d.rid===rid).sort((a,b)=>b.fecha>a.fecha?1:-1).slice(0,8);
  if(!list.length)return`<div style="text-align:center;color:#cbd5e1;padding:22px 0;font-size:14px">${LAST?"Sin registros aún":"⏳ Cargando..."}</div>`;
  return list.map(d=>{
    const reg=getReg(d.rid),ga=getGer(d.ap?.gid),gc=d.ci?getGer(d.ci.gid):null,t=dur(d.ap?.hora,d.ci?.hora),bc=CLR[d.rid]||"#e85d04";
    return`<div class="rrow" style="border-left-color:${bc}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:11px;font-weight:700;color:${bc}">${reg.n}</span>
        <div style="display:flex;align-items:center;gap:7px">
          <span style="font-size:11px;color:var(--s)">${shD(d.fecha)}</span>
          ${t?`<span class="bdg" style="background:#fff7ed;color:var(--o)">${t}</span>`:""}
          <button onclick="delDia('${d._k}')" style="background:transparent;border:none;color:#e2e8f0;font-size:14px;cursor:pointer;padding:2px">✕</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div style="background:#fff7ed;border-radius:8px;padding:8px">
          <div style="font-size:9px;font-weight:700;color:var(--o)">🌅 APERTURA</div>
          <div style="font-size:12px;font-weight:700;margin-top:2px">${ga.n||"—"}</div>
          <div style="font-size:10px;color:var(--s)">${d.ap?.hora||""}</div>
        </div>
        <div style="background:${gc?"#eff6ff":"#f8fafc"};border-radius:8px;padding:8px">
          <div style="font-size:9px;font-weight:700;color:var(--b)">🌆 CIERRE</div>
          <div style="font-size:12px;font-weight:700;margin-top:2px">${gc?gc.n:"Pendiente"}</div>
          <div style="font-size:10px;color:var(--s)">${d.ci?.hora||""}</div>
        </div>
      </div>
      ${d.nota?`<div style="font-size:11px;color:#d97706;margin-top:8px">📝 ${d.nota}</div>`:""}
    </div>`;
  }).join("");
}

// ── DISTRIBUCIÓN ──
function rDist(){
  const isA=SES.role==="admin",show=isA?REGS:REGS.filter(r=>r.id===SES.rid);
  setTimeout(()=>{if(DIST_T!==null){const el=document.getElementById("rc-"+DIST_T);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});DIST_T=null}},150);
  return`<div class="pg">${pfWidget()}${show.map(r=>{
    if(r.id===0){
      const tot=gFDias().filter(d=>d.rid===0).length,cs=GERS.map(g=>({...g,v:vcnt(g.id,0)})).sort((a,b)=>b.v-a.v),mx=Math.max(...cs.map(c=>c.v),1);
      return`<div id="rc-0" class="card" style="margin-bottom:14px;scroll-margin-top:130px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
          <div><div style="font-size:15px;font-weight:800">DOZ</div><div style="font-size:11px;color:var(--s)">${tot} días · ${perLbl()}</div></div>
          <span class="bdg" style="background:#fff7ed;color:var(--o);border:1.5px solid #fed7aa">Cuartel completo</span>
        </div>
        <div class="div"></div>
        ${REGS.filter(x=>x.id!==0).map(rg=>`<div style="margin-bottom:14px">
          <div style="font-size:10px;font-weight:700;color:var(--s);letter-spacing:.8px;text-transform:uppercase;margin-bottom:7px;padding-bottom:4px;border-bottom:1px solid var(--g)">${rg.n}</div>
          ${cs.filter(g=>g.r===rg.id).map(g=>{const pct=Math.round(g.v/mx*100),bc=bCol(g.v,mx);return`<div style="margin-bottom:7px">
            <div style="display:flex;justify-content:space-between;margin-bottom:3px">
              <span style="font-size:12px;font-weight:700">${g.n} <span style="font-size:10px;color:var(--s)">${g.cod}</span></span>
              <span style="font-size:13px;font-weight:800;color:${g.v>0?bc:"#ef4444"}">${g.v}</span>
            </div>
            <div class="bar-bg"><div class="bar" style="width:${pct}%;background:${bc}"></div></div>
          </div>`}).join("")}
        </div>`).join("")}
      </div>`;
    }
    const sc=eqScore(r.id),si=sInfo(sc),cs=grByR(r.id).map(g=>({...g,v:vcnt(g.id,r.id)})).sort((a,b)=>b.v-a.v);
    const mx=Math.max(...cs.map(c=>c.v),1),mn=Math.min(...cs.map(c=>c.v)),tot=cs.reduce((a,b)=>a+b.v,0);
    return`<div id="rc-${r.id}" class="card" style="margin-bottom:14px;scroll-margin-top:130px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px">

        <div style="display:flex;align-items:center;gap:8px">
          ${sc!==null?`<div style="font-size:22px;font-weight:800;color:${si.c}">${sc}%</div>`:""}
          <span class="bdg" style="background:${si.bg};color:${si.c}">${si.t}</span>
        </div>
      </div>
      <div class="div"></div>
      ${cs.map((g,i)=>{const pct=Math.round(g.v/mx*100),bc=bCol(g.v,mx),isTop=g.v===mx&&mx>0,isLow=g.v===mn;
        return`<div style="margin-bottom:11px">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px;gap:6px">
            <div style="display:flex;align-items:center;gap:6px;flex:1;min-width:0">

                <span style="font-size:10px;color:var(--s);margin-left:4px">${g.cod}</span>
                ${isTop&&tot>0?`<span class="bdg" style="background:#fee2e2;color:#dc2626;margin-left:4px;font-size:9px">↑ más</span>`:""}
                ${isLow&&g.v===0&&tot>0?`<span class="bdg" style="background:#fee2e2;color:#dc2626;margin-left:4px;font-size:9px">sin visitas</span>`:""}
                ${isLow&&g.v>0&&!isTop?`<span class="bdg" style="background:#fef3c7;color:#d97706;margin-left:4px;font-size:9px">↓ menos</span>`:""}
              </div>
            </div>
            <span style="font-size:13px;font-weight:800;color:${g.v>0?bc:"#ef4444"};flex-shrink:0">${g.v}</span>
          </div>

              ${sinC?`<span class="bdg" style="background:#fef3c7;color:#d97706">🔓 Sin cierre</span>`:""}
              ${!tarde&&!sinC&&d.ap?`<span class="bdg" style="background:#dcfce7;color:#16a34a">✓</span>`:""}
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div style="background:${tarde?"#fff1f2":apMin!==null?"#f0fdf4":"#fff7ed"};border-radius:10px;padding:10px;border:1.5px solid ${tarde?"#fca5a5":apMin!==null?"#86efac":"#fed7aa"}">
              <div style="font-size:9px;font-weight:700;color:${tarde?"#dc2626":apMin!==null?"#16a34a":"var(--o)"};letter-spacing:.8px;margin-bottom:4px">🌅 APERTURA</div>
              ${d.ap?.lat?`<a href="https://www.google.com/maps?q=${d.ap.lat},${d.ap.lng}" target="_blank" style="text-decoration:none"><div style="font-size:17px;font-weight:800;color:${tarde?"#dc2626":apMin!==null?"#16a34a":"var(--o)"}">${d.ap?.hora||"—"} 📌</div></a>`:`<div style="font-size:17px;font-weight:800;color:${tarde?"#dc2626":apMin!==null?"#16a34a":"var(--o)"}">${d.ap?.hora||"—"}</div>`}
              <div style="font-size:11px;color:var(--t);font-weight:600;margin-top:3px">${gerAp.n||"—"}</div>
              <div style="font-size:10px;color:var(--s)">${gerAp.cod||""}</div>
              ${tarde?`<div style="font-size:9px;color:#dc2626;font-weight:700;margin-top:3px">⚠ Después de las 9:00 a.m.</div>`:apMin!==null?`<div style="font-size:9px;color:#16a34a;font-weight:700;margin-top:3px">✓ Antes de las 9:00 a.m.</div>`:""}
              ${d.ap?.lat?`<div style="font-size:9px;color:${tarde?"#dc2626":"#16a34a"};font-weight:700;margin-top:3px"><a href="https://www.google.com/maps?q=${d.ap.lat},${d.ap.lng}" target="_blank" style="color:inherit;text-decoration:none">📌 Ver en Maps</a></div>`:`<div style="font-size:9px;color:#cbd5e1;margin-top:3px">Sin GPS</div>`}
            </div>
            <div style="background:${sinC?"#fffbeb":d.ci?"#f0fdf4":"#f8fafc"};border-radius:10px;padding:10px;border:1.5px solid ${sinC?"#fcd34d":d.ci?"#86efac":"#e2e8f0"}">
              <div style="font-size:9px;font-weight:700;color:${sinC?"#d97706":d.ci?"#16a34a":"var(--s)"};letter-spacing:.8px;margin-bottom:4px">🌆 CIERRE</div>
              ${d.ci?`${d.ci?.lat?`<a href="https://www.google.com/maps?q=${d.ci.lat},${d.ci.lng}" target="_blank" style="text-decoration:none"><div style="font-size:17px;font-weight:800;color:#16a34a">${d.ci.hora||"—"} 📌</div></a>`:`<div style="font-size:17px;font-weight:800;color:#16a34a">${d.ci.hora||"—"}</div>`}
                <div style="font-size:11px;color:var(--t);font-weight:600;margin-top:3px">${gerCi?gerCi.n:"—"}</div>
                <div style="font-size:10px;color:var(--s)">${gerCi?gerCi.cod:""}</div>
                ${d.ci?.lat?`<div style="font-size:9px;color:#16a34a;font-weight:700;margin-top:3px"><a href="https://www.google.com/maps?q=${d.ci.lat},${d.ci.lng}" target="_blank" style="color:inherit;text-decoration:none">📌 Ver en Maps</a></div>`:`<div style="font-size:9px;color:#cbd5e1;margin-top:3px">Sin GPS</div>`}`
                :`<div style="font-size:14px;font-weight:800;color:#d97706">Pendiente</div><div style="font-size:9px;color:#d97706;font-weight:700;margin-top:5px">🔓 No registró salida</div>`}
            </div>
          </div>
          ${d.nota?`<div style="font-size:11px;color:#d97706;margin-top:9px;padding:7px 9px;background:#fffbeb;border-radius:8px">📝 ${d.nota}</div>`:""}
        </div>`;
      }).join("")}
  </div>`;
}

// ── RESUMEN ──
function rRes(){
  const dias=gFDias(),tot=dias.length;
  const ac=GERS.map(g=>{const v=dias.filter(d=>d.ap?.gid===g.id||d.ci?.gid===g.id).length;return{...g,v}}).sort((a,b)=>b.v-a.v);
  const sv=ac.filter(g=>g.v===0),cv=ac.filter(g=>g.v>0);
  return`<div class="pg">
    ${pfWidget()}
    <div class="stats">
      <div class="stat"><div class="stat-n" style="color:var(--o)">${tot}</div><div class="stat-l">Total días</div></div>
      <div class="stat"><div class="stat-n" style="color:#16a34a">${cv.length}/${GERS.length}</div><div class="stat-l">Cubiertas</div></div>
      <div class="stat"><div class="stat-n" style="color:${sv.length>0?"#dc2626":"#16a34a"}">${sv.length}</div><div class="stat-l">Sin visitar</div></div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:var(--s);letter-spacing:.8px;text-transform:uppercase;margin-bottom:13px">Índice de Equidad</div>
      ${REGS.filter(r=>r.id!==0).map(r=>{const sc=eqScore(r.id),si=sInfo(sc),t=gFDias().filter(d=>d.rid===r.id).length;
        return`<div onclick="DIST_T=${r.id};VIEW='DIST';R()" style="margin-bottom:13px;cursor:pointer;padding:9px;border-radius:10px;transition:background .15s" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='transparent'">
          <div style="display:flex;justify-content:space-between;margin-bottom:5px;align-items:center">
            <div style="display:flex;align-items:center;gap:8px">
              <div style="width:10px;height:10px;border-radius:50%;background:${CLR[r.id]||"#e85d04"};flex-shrink:0"></div>
              <span style="font-size:13px;font-weight:700">${r.n}</span>
              <span style="font-size:11px;color:var(--s)">${t} días</span>
            </div>
            <div style="display:flex;align-items:center;gap:7px">
              <span style="font-size:13px;font-weight:800;color:${si.c}">${sc!==null?sc+"%":"—"}</span>
              <span class="bdg" style="background:${si.bg};color:${si.c}">${si.t}</span>
              <span style="font-size:16px;color:var(--s)">›</span>
            </div>
          </div>
          <div class="bar-bg" style="height:6px"><div class="bar" style="width:${sc||0}%;background:${si.c}"></div></div>
        </div>`}).join("")}
      <div style="font-size:10px;color:#cbd5e1;margin-top:8px">100% = distribución perfecta · menos de 45% = alta concentración</div>
      <div class="div"></div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div><span style="font-size:13px;font-weight:700">DOZ</span><span style="font-size:11px;color:var(--s);margin-left:8px">${gFDias().filter(d=>d.rid===0).length} días</span></div>
        <span class="bdg" style="background:#fff7ed;color:var(--o);border:1.5px solid #fed7aa">Cuartel completo</span>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
      <div class="card">
        <div style="font-size:10px;font-weight:700;color:#dc2626;letter-spacing:.8px;text-transform:uppercase;margin-bottom:12px">🔴 Más visitadas</div>
        ${cv.slice(0,5).map(g=>`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px">
          <div><div style="font-size:12px;font-weight:700">${g.n}</div><div style="font-size:10px;color:var(--s)">${getReg(g.r).n}</div></div>
          <span style="font-size:15px;font-weight:800;color:#dc2626">${g.v}</span>
        </div>`).join("")||`<div style="color:#cbd5e1;font-size:12px">Sin datos</div>`}
      </div>
      <div class="card">
        <div style="font-size:10px;font-weight:700;color:#16a34a;letter-spacing:.8px;text-transform:uppercase;margin-bottom:12px">🟢 Menos visitadas</div>
        ${(sv.length>0?sv:ac.slice().reverse()).slice(0,5).map(g=>`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px">
          <div><div style="font-size:12px;font-weight:700">${g.n}</div><div style="font-size:10px;color:var(--s)">${getReg(g.r).n}</div></div>
          <span style="font-size:15px;font-weight:800;color:${g.v===0?"#94a3b8":"#16a34a"}">${g.v}</span>
        </div>`).join("")||`<div style="color:#cbd5e1;font-size:12px">Sin datos</div>`}

    <div class="card">
      <div style="font-size:11px;font-weight:700;color:var(--s);letter-spacing:.8px;text-transform:uppercase;margin-bottom:13px">Opciones</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn btn-g" onclick="exportCSV()">📊 Exportar CSV</button>

        <button class="btn btn-r" onclick="confReset()">🗑 Borrar todos los registros</button>
      </div>
    </div>

}

// ── OPCIONES ──
function openPins(){
  const roles=[{k:"admin",l:"DOZ"},...REGS.filter(r=>r.id!==0).map(r=>({k:String(r.id),l:r.n}))];
  showM(`<div style="font-size:16px;font-weight:800;margin-bottom:4px">🔒 Cambiar PINs</div>
    <div style="font-size:13px;color:var(--s);margin-bottom:16px">4 dígitos por usuario</div>
    ${roles.map(r=>`<div style="margin-bottom:12px"><span class="lbl">${r.l}</span>
      <input type="password" id="p_${r.k}" maxlength="4" placeholder="••••" value="${PINS[r.k]||""}" style="text-align:center;letter-spacing:6px;font-size:18px"></div>`).join("")}
    <button class="btn btn-o" style="margin-top:8px" onclick="savePins2()">✓ Guardar</button>
    <button class="btn btn-g" style="margin-top:8px" onclick="closeM()">Cancelar</button>`);
}
function savePins2(){["admin","1","2","3","4","5"].forEach(k=>{const v=document.getElementById("p_"+k)?.value;if(v&&/^\d{4}$/.test(v))PINS[k]=v});svP();closeM();showT("✓ PINs actualizados")}
function confReset(){
  showM(`<div style="text-align:center"><div style="font-size:34px;margin-bottom:10px">⚠️</div>
    <div style="font-size:15px;font-weight:800;margin-bottom:6px">¿Borrar todo?</div>
    <div style="font-size:13px;color:#64748b;margin-bottom:20px">Se eliminarán todos los registros. No se puede deshacer.</div>
    <button class="btn btn-o" onclick="doReset()">Sí, borrar todo</button>
    <button class="btn btn-g" style="margin-top:8px" onclick="closeM()">Cancelar</button></div>`);
}
async function doReset(){try{await fbD("dias");await syncNow(true);closeM();showT("Datos eliminados","#dc2626")}catch(e){showT("⚠ Error","#dc2626")}}
function exportCSV(){
  // Exportar SOLO los datos del filtro activo
  const dias=gFDias();if(!dias.length){showT("Sin registros en el período seleccionado","#dc2626");return}
  const periodo=perLbl().replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ\s\-]/g,"").trim().replace(/\s+/g,"_");
  let csv=`Período: ${perLbl()}\nFecha,Regional,Ger.Apertura,Cod,Hora Apertura,GPS Ap,Ger.Cierre,Cod,Hora Cierre,GPS Ci,Tiempo,Nota\n`;
  dias.sort((a,b)=>a.fecha>b.fecha?1:-1).forEach(d=>{
    const reg=getReg(d.rid),ga=getGer(d.ap?.gid),gc=d.ci?getGer(d.ci.gid):{},t=dur(d.ap?.hora,d.ci?.hora)||"";
    const gpsAp=d.ap?.lat?`${d.ap.lat},${d.ap.lng}`:"",gpsCi=d.ci?.lat?`${d.ci.lat},${d.ci.lng}`:"";
    csv+=`"${d.fecha}","${reg.n}","${ga.n||""}","${ga.cod||""}","${d.ap?.hora||""}","${gpsAp}","${gc.n||""}","${gc.cod||""}","${d.ci?.hora||""}","${gpsCi}","${t}","${d.nota||""}"\n`;
  });
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"}));
  a.download=`visitas_${periodo}_${fd(new Date())}.csv`;a.click();showT("✓ CSV descargado ("+dias.length+" registros)");
}

// ── RENDER ──

  if(!SES){rLogin();return}

  const tabs=isA
    ?[["REG","📋 Registro"],["DIST","📊 Distribución"],["CAL","📅 Calendario"],["MAP","🗺️ Mapa"],["HOR","⏱ Horarios"],["RES","🏆 Resumen"]]
    :[["REG","📋 Registro"],["DIST","📊 Distribución"],["CAL","📅 Calendario"],["HOR","⏱ Horarios"]];
  const vc=VIEW==="REG"?rReg():VIEW==="DIST"?rDist():VIEW==="CAL"?rCal():VIEW==="MAP"?rMapa():VIEW==="HOR"?rHor():rRes();
  Q("root",`
  <div class="hdr">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="logo">📍</div>
      <div>
        <div style="font-size:14px;font-weight:800">Supervisión de Visitas</div>
        <div id="si" style="font-size:10px;font-weight:600;color:${sc}">${st}</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:12px;font-weight:700">${nm}</span>
      <button class="btn btn-g btn-sm" onclick="logout()">Salir</button>
    </div>
  </div>
  <div class="tabs">${tabs.map(([v,l])=>`<button class="tab ${VIEW===v?"on":""}" onclick="swTab('${v}')">${l}</button>`).join("")}</div>
  ${vc}
  <div style="text-align:center;padding:14px;font-size:10px;color:#cbd5e1;letter-spacing:.8px">CUARTEL NEZAHUALCÓYOTL · 5 REGIONALES · 34 GERENCIAS</div>`);
}

if(SES){R();startP()}else{R()}
